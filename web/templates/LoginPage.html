<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - FastGoodCuisine</title>
  <link rel="stylesheet" href="../styles/RegisterPage.css">
</head>
<body>
<div class="container">
  <div class="register-card">
    <div class="header">
      <h1>FastGoodCuisine</h1>
      <p>Connectez-vous pour retrouver vos recettes préférées</p>
    </div>

    <form class="register-form" action="/login" method="POST">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit" class="btn-submit">Se connecter</button>

      <div class="login-link">
        Pas encore de compte ? <a href="/">S'inscrire</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
